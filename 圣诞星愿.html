   fill(g,'M-169 -44Q-161 -49 -151 -44Q-139 -36 -139 -14L-179 -14Q-181 -37 -169 -44Z','#af1647');
   fill(g,'M-166 -45Q-154 -37 -145 -34Q-139 -32 -133 -38L-128 -36Q-134 -20 -145 -25Q-155 -28 -162 -33Z','#f0545e');
   line(g,'M-136 -37L-132 -34','#fff0e4',4.6);dot(g,-129,-37,3.6,'#60284a');
   fill(g,'M-175 -20Q-162 -24 -140 -21L-140 -14L-176 -14Z','#532749');dot(g,-155,-20,2.4,'#ffca70');
   dot(g,-158.8,-55,12.4,'#ffa387');
   fill(g,'M-171 -56Q-177 -59 -172 -66Q-169 -75 -155 -79Q-164 -70 -150 -64Q-144 -62 -145 -55Z','#e5264d');dot(g,-154,-79,4.7,'#fff3ea');

   fill(g,'M-171 -54Q-165 -49 -160 -51Q-154 -49 -149 -53Q-145 -42 -153 -36Q-163 -36 -169 -43Z','#fff2ef');
   fill(g,'M-162 -49Q-157 -53 -152 -48Q-159 -49 -163 -46Z','#fffaf1');dot(g,-153,-54,1,'#512246');dot(g,-150,-51,2,'#ffa183');
   const hull=P('M-218 -30Q-211 -31 -207 -26Q-192 -11 -163 -11L-143 -11Q-132 -11 -129 -23Q-123 -33 -116 -29Q-119 -24 -117 -20L-120 -8Q-124 7 -148 8L-198 8Q-213 7 -215 -8Z');
   const paint=g.createLinearGradient(-180,-30,-180,10);paint.addColorStop(0,'#ff5b67');paint.addColorStop(.46,'#d72752');paint.addColorStop(1,'#901744');g.fillStyle=paint;g.fill(hull);g.strokeStyle='#ffcb98';g.lineWidth=2;g.stroke(hull);

   for(let i=0;i<4;i++)dot(g,-195+i*13,-1+(i%2)*1.3,1.2,'#ffdf92');
   g.restore();
  }
  function sprite(n){let img=sprites[n];if(img)return img;
   img=document.createElement('canvas');img.width=920;img.height=272;const g=img.getContext('2d');g.translate(464,174);g.scale(2,2);
   const a=(n/8*Math.PI*2), phase=Math.sin(a)*.49;
   // Reins continue through the harnesses of the three silhouetted reindeer.
   line(g,'M-129 -37Q-109 -15 -68 -31Q-29 -10 0 -37Q33 -17 64 -47Q98 -25 138 -53','#a56a60',3.6);
   line(g,'M-129 -37Q-109 -15 -68 -31Q-29 -10 0 -37Q33 -17 64 -47Q98 -25 138 -53','#ffca8e',1.35);
   deer(g,-98+Math.sin(a)*1.4,-10+Math.cos(a)*1.7,.88,phase,false);
   deer(g,-22+Math.sin(a+1.4)*1.6,-20+Math.cos(a+1.4)*2,.96,Math.sin(a+1.4)*.49,false);
   deer(g,60+Math.sin(a+2.6)*1.9,-33+Math.cos(a+2.6)*2,1.03,Math.sin(a+2.6)*.49,true);

  function fly(){if($('lightbox').open)return;start=performance.now()/1000;next();status.textContent='圣诞老人和三只驯鹿正在经过星河';set(true)}
  function next(){if(clock0>=0)autoSlot=Math.max(autoSlot,Math.floor((start-clock0-16)/between)+1)}
  sBtn.addEventListener('click',fly);
  function draw(g,now){
   if(clock0<0)clock0=now;
   const autoAt=clock0+16+autoSlot*between;
   if(!reduced&&now>=autoAt&&now-start>T){start=now;autoSlot++;set(true)}
   const time=now-start;
   if(time>T){set(false);return}
   const p=clamp(time/T), upper=w<600, scale=clamp(w/900,upper?.56:.68,1.36), size=scale;
   const x=reduced?w*.60:-w*.16+p*w*1.41+130*size, y=h*(.325-.116*Math.sin(p*Math.PI)-.045*p)+Math.min(89,h*.116)+(reduced?0:Math.sin(p*22)*5);

 function play(){if($('lightbox').open)return;begin=performance.now();document.body.dataset.spell='true';btn.setAttribute('aria-pressed','true');$('spellText').textContent='再施一次';$('magicStatus').textContent='呼神护卫已召唤';}
 btn.onclick=play;
 window.addEventListener('keydown',e=>{if(!e.repeat&&e.code==='KeyM'&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)){e.preventDefault();play()}});
 function frame(ms,w1,h1,d){if(!sc||!c||!w1||!h1)return;size(w1,h1,d);const t=reduced?0:ms/1000;if(ms-lastSky>=31){skyFrame(t);lastSky=ms}c.clearRect(0,0,w,h);if(blend>.15){c.save();c.globalAlpha=.28+blend*.29;prism.baseDisk(t,true);c.restore()}prism.helix(t);prism.flares(t);drawGlints(t);prism.wave(t);snow(c,t,true);santaFlight.draw(c,ms/1000);c.save();c.globalAlpha=.49;winterSky.bigSnow(c,t);c.restore();
  if(begin<0)return;let u=Math.max(0,(ms-begin)/1000);if(u>=7.35){begin=-1;document.body.dataset.spell='false';btn.setAttribute('aria-pressed','false');$('spellText').textContent='呼神护卫';return}
  if(reduced)u=2.4;
  const da=smooth(.28,1.45,u)*(1-smooth(4.72,6.65,u)),ra=smooth(.0,.60,u)*(1-smooth(5.6,7.34,u));const p=position(u);
  if(ra>.01){c.save();c.globalCompositeOperation='source-over';ellipseGlow(c,w*.50,h*.54,Math.min(w*.55,h*.79),h*.26,-.23,'100,160,255',ra*.54);ellipseGlow(c,p.x,p.y-h*.062,Math.min(w*.47,h*.63),h*.20,-.24,'132,172,255',ra*.33);glow(c,w*.5,h*.74,Math.min(w*.6,h*.36),'123,204,255',ra*(.16+.35*(1-smooth(.2,1.8,u))));c.restore()}
  ribbons(u,ra);deer(u,da);

})();

const merryAudio=$('merryAudio'),merrySound=$('merrySound'),soundText=$('soundText'),muteButton=$('merryMute');
const bgm=$('christmasBgm'), bgmButton=$('bgmToggle'), bgmLabel=$('bgmLabel');
const BGM_NORMAL=.72, BGM_DUCK=.25;
let christmasMuted=false,merryPlayed=false,merryStarting=false,bgmWanted=true,bgmPending=false,bgmPlayId=0;
try{christmasMuted=localStorage.getItem('christmas-star-sound')==='muted';bgmWanted=localStorage.getItem('christmas-star-bgm')!=='paused'}catch{}
function soundPref(key,value){try{localStorage.setItem(key,value)}catch{}}
function updateBgm(){
 const playing=!bgm.paused&&!christmasMuted&&!bgmPending;
 bgmButton.dataset.playing=String(playing);
 bgmButton.setAttribute('aria-pressed',String(playing));
 bgmLabel.textContent=playing?'音乐播放中':bgmPending?'加载音乐…':'背景音乐';
 bgmButton.setAttribute('aria-label',playing?'暂停背景音乐':'播放背景音乐');
 bgmButton.title=(playing?'暂停':'播放')+'《We Wish You a Merry Christmas》';
}
function duckMusic(duck){try{bgm.volume=duck?BGM_DUCK:BGM_NORMAL}catch{}}
function startBgm(explicit=false){
 if(christmasMuted||!bgmWanted||bgmPending||!bgm.paused)return;
 const requestId=++bgmPlayId;
 bgmPending=true;updateBgm();
 bgm.play().catch(err=>{if(requestId===bgmPlayId&&explicit&&err.name!=='AbortError')toast('音乐未能播放，请再点一次或用系统浏览器打开')}).finally(()=>{if(requestId===bgmPlayId){bgmPending=false;updateBgm()}});
}
function pauseBgm(){bgmPlayId++;bgmPending=false;bgm.pause();updateBgm()}
for(const evt of ['play','playing','pause','ended','emptied','error'])bgm.addEventListener(evt,updateBgm);
function updateMerrySound(){
 merrySound.dataset.muted=String(christmasMuted);
 soundText.textContent='圣诞音效';merrySound.title=christmasMuted?'取消静音并播放圣诞祝福':'重播圣诞铃与英文祝福';
 muteButton.setAttribute('aria-pressed',String(christmasMuted));
 muteButton.setAttribute('aria-label',christmasMuted?'取消全部静音':'静音背景音乐和音效');muteButton.title=christmasMuted?'取消全部静音':'全部静音';updateBgm();
}
function setMerryMuted(next){
 christmasMuted=next;soundPref('christmas-star-sound',next?'muted':'on');
 if(next){pauseBgm();merryAudio.pause();if(merryAudio.readyState>0)merryAudio.currentTime=0;merryStarting=false;duckMusic(false)}
 else startBgm();
 updateMerrySound();
}
function playMerry(replay=false){
 if(christmasMuted||(!replay&&(merryPlayed||merryStarting)))return;
 if(replay&&merryAudio.readyState>0)merryAudio.currentTime=0;
 merryStarting=true;duckMusic(true);
 merryAudio.play().then(()=>{merryStarting=false;if(!christmasMuted)merryPlayed=true}).catch(err=>{merryStarting=false;duckMusic(false);if(replay&&!christmasMuted&&err.name!=='AbortError')toast('音效未能播放，请再点一次或用系统浏览器打开')});
}
for(const evt of ['ended','pause','error'])merryAudio.addEventListener(evt,()=>duckMusic(false));
function startChristmasAudio(){startBgm();playMerry()}
duckMusic(false);updateMerrySound();
bgmButton.addEventListener('click',()=>{
 if(!christmasMuted&&(bgmPending||!bgm.paused)){bgmWanted=false;soundPref('christmas-star-bgm','paused');pauseBgm();return}
 bgmWanted=true;soundPref('christmas-star-bgm','on');
 if(christmasMuted){christmasMuted=false;soundPref('christmas-star-sound','on');updateMerrySound()}
 startBgm(true);
});
merrySound.addEventListener('click',()=>{if(christmasMuted)setMerryMuted(false);playMerry(true)});
muteButton.addEventListener('click',()=>setMerryMuted(!christmasMuted));
document.addEventListener('click',e=>{if(e.isTrusted&&e.target instanceof Element&&e.target.closest('#stage,#toggle,#spell,#santa,#camera,#reset,#add,#fullscreen,[data-shape]'))startChristmasAudio()},true);
window.addEventListener('keydown',e=>{if(e.isTrusted&&!e.repeat&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!$('lightbox').open&&(e.code==='KeyM'||e.code==='Space'&&!/^(BUTTON|INPUT)$/.test(document.activeElement?.tagName)))startChristmasAudio()},true);

</script></body></html>
